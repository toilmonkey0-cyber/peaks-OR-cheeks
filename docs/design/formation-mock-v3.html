<style>

  display:flex;flex-direction:column;box-shadow:0 14px 34px rgba(0,0,0,.35);color-scheme:dark}

#fs-root .fs-say{position:relative;min-height:34px;padding:2px 16px;text-align:center;font-size:15px;color:#dbe3ee;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

#fs-root .fs-mute{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);color:var(--dim);font-size:15px;font-weight:800;flex:0 0 auto}
#fs-root .fs-mute.off{color:#f87171;border-color:#f87171}

#fs-root .fs-vig{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;transition:opacity .4s ease;
  background:radial-gradient(circle at var(--cx,50%) var(--cy,75%),rgba(3,5,10,0) 0,rgba(3,5,10,0) 70px,rgba(3,5,10,.92) 290px)}
#fs-root .fs-vig.live{transition:none}
#fs-root .fs-fx{position:absolute;inset:0;width:100%;height:100%;z-index:10;pointer-events:none}

@keyframes fs-idle{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.025)}}
@keyframes fs-sweep{from{transform:translateX(-180px)}to{transform:translateX(420px)}}
@keyframes fs-stamp{0%{opacity:0;transform:translate(-50%,-50%) scale(2.2)}18%{opacity:1;transform:translate(-50%,-50%) scale(.94)}30%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.04)}}
@keyframes fs-flash{0%{opacity:.7}100%{opacity:0}}
@keyframes fs-quake{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-1px)}}
@keyframes fs-land{0%{transform:translate(-50%,-50%) scale(1.5)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes fs-ring{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(1.5)}}
@keyframes fs-glow{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,0)}50%{box-shadow:0 0 1.8cqw .5cqw rgba(251,191,36,.55)}}

<script>
(() => {
  const root = document.getElementById("fs-root");

    for (let i = 0; i < (flutter ? 40 : 70); i++) {
      fx.bits.push(flutter
        ? { x: x - 120 + Math.random() * 240, y: y - 160 - Math.random() * 40, vx: (Math.random() - 0.5) * 1.1, vy: 0.35 + Math.random() * 0.9, c: colors[rnd(colors.length)], life: 1.6, sway: Math.random() * 6, flutter: true }
        : { x: x, y: y, vx: (Math.random() - 0.5) * 9, vy: -Math.random() * 8 - 2, c: colors[rnd(colors.length)], life: 1, sway: 0, flutter: false });
    }
    fxKick();
  }

  function chargeStart() {
    const Q = G.Q;
    if (C.active || G.busy || Q.over || G.sheet) return;
    if (!eligible(Q).length) { G.saying = "Every clue is out. <b>Make the call.</b>"; updateAction(); return; }
    ac();
    C.active = true; C.t0 = C.last = performance.now(); C.level = 0; C.phase = -Math.PI / 2; C.hap = -1; C.over = false;
    card.classList.remove("idle");
    card.style.transition = "none";
    face.className = "fs-face back";
    setFace("THE DECK", "?", "CHARGING");
    vig.classList.add("live");
    fxSize();
    const tgt = cardCenter();
    fx.parts = Array.from({ length: 90 }, () => spawn({}, tgt));
    riserStart();
    updateAction();
    fxKick();
  }

  function flyCard(si, i, p) {
    return new Promise((done) => {
      const slotEl = phone.querySelector(`.fg-chip[data-si="${si}"][data-i="${i}"]`);
      const a = card.getBoundingClientRect();
      if (!slotEl || reduceMotion()) { card.style.opacity = "0"; done(); return; }
      const b = slotEl.getBoundingClientRect();
      const clone = document.createElement("div");
      clone.className = "fs-clone" + (p.face === "gold" ? " gold" : p.face === "brown" ? " brown" : "");
      clone.innerHTML = `<span class="n">${esc(p.num)}</span><span class="p">${esc(p.sub || where(si, p.s))}</span>`;
      root.appendChild(clone);
      const x0 = a.left + a.width / 2 - 26, y0 = a.top + a.height / 2 - 29.5;
      const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
      const s0 = a.width / 52, s1 = b.width / 52;
      card.style.opacity = "0";
      sfx.whoosh();
      clone.animate([
        { transform: `translate(${x0}px, ${y0}px) scale(${s0}) rotate(0deg)` },
        { transform: `translate(${x0 + dx * 0.55}px, ${y0 + dy - 48}px) scale(${(s0 + s1) / 2 + 0.15}) rotate(-8deg)`, offset: 0.55 },
        { transform: `translate(${x0 + dx}px, ${y0 + dy}px) scale(${s1}) rotate(0deg)` },
      ], { duration: 560, easing: "cubic-bezier(.3,.7,.4,1)", fill: "forwards" }).onfinish = () => { clone.remove(); done(); };
    });
  }

  async function revealAndFly(p, first) {
    const rm = reduceMotion();
    const S = G.Q.sides[p.si], i = S.slots.indexOf(p.s);
    card.classList.remove("idle");
    card.style.opacity = "1";
    card.style.transition = "transform .35s cubic-bezier(.2,1.2,.4,1)";
    card.style.transform = `translate(0, -10px) scale(${rm ? 1 : first ? 1.3 : 1.18})`;
    card.style.setProperty("--glow", "0.5");
    face.className = "fs-face reel";
    const spinMs = rm ? 120 : first ? 950 : 620;
    if (!rm) face.animate([{ transform: "rotateY(0deg)" }, { transform: `rotateY(${first ? 1440 : 1080}deg)` }], { duration: spinMs, easing: "cubic-bezier(.12,.75,.25,1)" });
    const t0 = performance.now();
    await new Promise((res) => {
      const iv = setInterval(() => {
        if (performance.now() - t0 > spinMs - 110) { clearInterval(iv); res(); return; }
        sfx.tick();
        setFace(where(p.si, p.s), "#" + (1 + rnd(98)), "");
      }, rm ? 40 : 75);
    });
    await sleep(rm ? 0 : 110);
    face.className = "fs-face " + p.face;
    setFace(where(p.si, p.s), p.num, p.sub);
    if (p.face === "gold") { sfx.gold(); buzz(HAPTIC.peak); stamp(0, "PEAK", "peak"); burst(["#fde68a", "#fbbf24", "#fff7d6"], false); }
    else if (p.face === "brown") {
      sfx.droop(); buzz(HAPTIC.cheeks); stamp(0, "CHEEKS", "cheeks"); burst(["#b07a4c", "#7c4a21", "#8d99ab"], true);
      card.style.transition = "transform .6s ease-in";
      card.style.transform = `translate(0, -2px) scale(${rm ? 1 : 1.18}) rotate(-4deg)`;
    }
    else sfx.call();
    G.saying = esc(p.toast);
    updateAction();
    await sleep(rm ? 60 : p.face === "plain" ? 430 : 780);
    await flyCard(p.si, i, p);
    commit(p.s, p);
    G.log.unshift({ n: G.Q.spins, kind: p.kind === "fd" ? "peak" : p.kind, text: p.toast });
    render();
    sfx.thud(); buzz(HAPTIC.land);
    await sleep(rm ? 30 : 200);
  }

  async function release() {
    if (!C.active) return;
    C.active = false;
    const perfect = C.level >= 1 && Math.sin(C.phase) > 0.75;
    riserStop();
    vig.classList.remove("live");
    G.busy = true;
    updateAction();
    const tgt = cardCenter();
    sfx.kick(); buzz(HAPTIC.kick);
    if (!reduceMotion()) { phone.classList.remove("quake"); void phone.offsetWidth; phone.classList.add("quake"); }
    const now = performance.now();
    fx.rings.push({ x: tgt.x, y: tgt.y, r0: tgt.r, r1: Math.max(fx.w, fx.h) * (0.4 + C.level * 0.5), dur: 420, t0: now, col: "200,235,255", w: 2 + C.level * 3 });
    if (perfect) {
      fx.rings.push({ x: tgt.x, y: tgt.y, r0: tgt.r * 0.5, r1: Math.max(fx.w, fx.h), dur: 640, t0: now + 70, col: "253,230,138", w: 5 });
      sfx.perfect(); buzz(HAPTIC.perfect); stamp(1, "PERFECT", "perfect"); flash();
      G.perfects++;
    } else if (C.level >= 1) sfx.boom();
    fxKick();
    const Q = G.Q;
    Q.spins++;
    const n = Q.noHuddle ? 2 : 1;
    Q.noHuddle = false;
    const plans = [];
    for (let k = 0; k < n; k++) { const x = choose(Q); if (!x) break; plans.push(planReveal(x.si, x.s)); }
    top.querySelector(".fg-hud").outerHTML = hud();
    for (let k = 0; k < plans.length; k++) await revealAndFly(plans[k], k === 0);
    vig.style.opacity = "0";
    resetCard();
    G.busy = false;
    updateAction();
  }

  // ---------- input ----------
  phone.addEventListener("pointerdown", (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    if (!e.target.closest(".fs-card, [data-act='spin']")) return;
    if (spinBtn.disabled && !e.target.closest(".fs-card")) return;
    e.preventDefault();
    chargeStart();
  });
  window.addEventListener("pointerup", () => { if (C.active) release(); });
  window.addEventListener("pointercancel", () => { if (C.active) release(); });
  spinBtn.addEventListener("keydown", (e) => {
    if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); chargeStart(); }
  });
  spinBtn.addEventListener("keyup", (e) => {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (C.active) release(); }
  });

  phone.addEventListener("click", (e) => {
    const t = e.target.closest("[data-act]");
    if (!t || !phone.contains(t) || t.disabled) return;
    const act = t.dataset.act;
    if (act === "mute") { soundOn = !soundOn; if (soundOn) { ac(); sfx.tick(); } else riserStop(); updateAction(); return; }
    if (act === "spin" || C.active || G.busy) return;
    const Q = G.Q, sh = G.sheet;
    if (act === "call") G.sheet = { type: "call", si: +t.dataset.si };
    else if (act === "pick" && sh?.type === "call") { G.sheet = null; call(G, sh.si, t.dataset.ab); return; }
    else if (act === "slot") {
      const si = +t.dataset.si, i = +t.dataset.i, s = Q.sides[si].slots[i];
      if (Q.film && !Q.over && !s.fd && !s.ghost && s.layer >= 1 && s.layer < 3) {
        s.layer = s.layer < 2 ? 2 : 3; s.anim = true; Q.film = false;
        G.saying = esc("FILM: " + where(si, s) + " #" + s.num + " is " + s.ini + (s.layer === 3 ? ", from " + s.col : "") + ".");
        G.log.unshift({ n: Q.spins, kind: "plain", text: "FILM: " + where(si, s) + " #" + s.num + " is " + s.ini + "." });
      }
      else if (s.fd && !Q.over) G.sheet = { type: "fd", si, i };
      else G.sheet = { type: "detail", si, i };
    }
    else if (act === "fd-play" && sh?.type === "fd") {
      G.sheet = null;
      const s = Q.sides[sh.si].slots[sh.i];
      s.fd = false; s.layer = 2; s.anim = true; sfx.gold(); buzz(HAPTIC.peak);
      G.saying = esc("Flipped: " + where(sh.si, s) + " #" + s.num + " " + s.ini + ". A PEAK.");
      G.log.unshift({ n: Q.spins, kind: "peak", text: "Flipped: " + where(sh.si, s) + " #" + s.num + " " + s.ini + "." });
    }
    else if (act === "fd-spend" && sh?.type === "fd") G.sheet = { type: "plays", src: "fd", si: sh.si, i: sh.i };
    else if (act === "bank") { if (G.chips > 0 && !Q.over) G.sheet = { type: "plays", src: "bank" }; }
    else if (act === "tape") G.sheet = { type: "tape" };
    else if (act === "play" && sh?.type === "plays") {
      if (sh.src === "fd") { const s = Q.sides[sh.si].slots[sh.i]; s.fd = false; s.sealed = true; applyPlay(G, t.dataset.play); }
      else if (G.chips > 0) { G.chips--; applyPlay(G, t.dataset.play); }
      G.sheet = null;
    }
    else if (act === "close") G.sheet = null;
    else if (act === "next") { if (G.q < 4) { G.q++; deal(G); } }
    else if (act === "newgame") { G.q = 1; G.total = 0; G.chips = 0; G.perfects = 0; deal(G); }
    render();
  });
  phone.addEventListener("keydown", (e) => { if (e.key === "Escape" && G.sheet) { G.sheet = null; render(); } });

  resetCard();
  render();
})();
</script>
