name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rollout:
    name: Peaks or Cheeks (rollout)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rollout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rollout/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  rippack:
    name: RipPack v1 (app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test

  pipeline:
    name: Data pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
