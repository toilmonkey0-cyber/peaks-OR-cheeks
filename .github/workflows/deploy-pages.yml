name: Deploy Peaks or Cheeks to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rollout/package-lock.json
      - run: npm ci
        working-directory: rollout
      # GITHUB_PAGES flips vite base to the repo subpath
      - run: npm run build
        working-directory: rollout
        env:
          GITHUB_PAGES: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: rollout/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
